<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ORB Trading Calculator</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 600px;
        margin: 0 auto;
        padding: 20px;
      }
      .input-group {
        margin-bottom: 15px;
      }
      label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
      }
      .input-row {
        display: flex;
        gap: 10px;
      }
      input[type="number"],
      select {
        padding: 8px;
        box-sizing: border-box;
        font-size: 14px;
      }
      input[type="number"] {
        width: 100%;
        -moz-appearance: textfield;
      }
      input[type="number"]::-webkit-outer-spin-button,
      input[type="number"]::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      select {
        width: 80px;
      }
      button {
        background-color: #4caf50;
        color: white;
        padding: 10px 15px;
        border: none;
        cursor: pointer;
        font-size: 16px;
      }
      .results {
        margin-top: 20px;
        padding: 15px;
        background-color: #f9f9f9;
        border-radius: 5px;
      }
      .result-item {
        margin-bottom: 10px;
      }
      .error-message {
        color: red;
        margin-top: 10px;
        display: none;
      }
    </style>
  </head>
  <body>
    <h1>ORB Trading Strategy Calculator</h1>

    <form id="calculatorForm">
      <div class="input-group">
        <label for="miniFuturePrice">Purchase Price of Mini Future:</label>
        <input
          type="number"
          id="miniFuturePrice"
          placeholder="e.g., 400.00"
          step="0.01"
          required
        />
      </div>

      <div class="input-group">
        <label for="leverage">Leverage:</label>
        <input
          type="number"
          id="leverage"
          placeholder="e.g., 5.00"
          step="0.01"
          required
        />
      </div>

      <div class="input-group">
        <label for="underlyingEntryPrice">Underlying Price ORB Entry:</label>
        <div class="input-row">
          <input
            type="number"
            id="underlyingEntryPrice"
            placeholder="e.g., 2100.00"
            step="0.01"
            required
          />
          <select id="underlyingCurrency">
            <option value="USD">USD</option>
            <option value="EUR">EUR</option>
            <option value="SEK">SEK</option>
          </select>
        </div>
      </div>

      <div class="input-group">
        <label for="atr14Day">14 Day ATR:</label>
        <div class="input-row">
          <input
            type="number"
            id="atr14Day"
            placeholder="e.g., 150.00"
            step="0.01"
            required
          />
          <select id="atrCurrency">
            <option value="USD">USD</option>
            <option value="EUR">EUR</option>
            <option value="SEK">SEK</option>
          </select>
        </div>
      </div>

      <button type="submit">Calculate Stop Loss</button>
      <div id="errorMessage" class="error-message">
        Please fill in all fields before calculating.
      </div>
    </form>

    <div class="results">
      <h2>Results</h2>

      <div class="result-item">
        <strong>Mini Future Stop Loss:</strong>
        <span id="stopLossMiniFuture">-</span>
        <span id="stopLossMiniFuturePercentage" style="color: #666">(-)</span>
      </div>

      <div class="result-item">
        <strong>Underlying Stop Loss</strong>
        <span id="bullStopLossUnderlying" style="color: green">-</span> /
        <span id="bearStopLossUnderlying" style="color: red">-</span>
        <span id="stopLossUnderlyingPercentage" style="color: #666">(-)</span>
      </div>

      <div class="result-item">
        <strong>Adjusted ATR Percentage (5% at leverage 3):</strong>
        <span id="adjustedAtrPercentage">-</span>
      </div>

      <div class="result-item">
        <strong>Adjusted ATR Value:</strong>
        <span id="adjustedAtrValue">-</span>
      </div>
    </div>

    <script>
      document
        .getElementById("calculatorForm")
        .addEventListener("submit", async function (event) {
          event.preventDefault();

          const inputs = document.querySelectorAll(
            '#calculatorForm input[type="number"]'
          );
          let hasEmptyField = false;

          inputs.forEach((input) => {
            if (!input.value.trim()) {
              hasEmptyField = true;
            }
          });

          if (hasEmptyField) {
            document.getElementById("errorMessage").style.display = "block";
          } else {
            document.getElementById("errorMessage").style.display = "none";
            await calculateStopLoss();
          }
        });

      document
        .querySelectorAll('#calculatorForm input[type="number"]')
        .forEach((input) => {
          input.addEventListener("input", function () {
            document.getElementById("errorMessage").style.display = "none";
          });
        });

      async function convertToSEK(amount, currency) {
        if (currency === "SEK") return amount;

        const response = await fetch(
          `https://api.frankfurter.app/latest?from=${currency}&to=SEK`
        );
        const data = await response.json();
        const rate = data.rates.SEK;
        return amount * rate;
      }

      async function calculateStopLoss() {
        const miniFuturePrice = parseFloat(
          document.getElementById("miniFuturePrice").value
        );
        const leverage = parseFloat(document.getElementById("leverage").value);
        const underlyingEntryPriceRaw = parseFloat(
          document.getElementById("underlyingEntryPrice").value
        );
        const atr14DayRaw = parseFloat(
          document.getElementById("atr14Day").value
        );
        const underlyingCurrency =
          document.getElementById("underlyingCurrency").value;
        const atrCurrency = document.getElementById("atrCurrency").value;

        const underlyingEntryPrice = await convertToSEK(
          underlyingEntryPriceRaw,
          underlyingCurrency
        );
        const atr14Day = await convertToSEK(atr14DayRaw, atrCurrency);

        const adjustedAtrPercentage = (5 * leverage) / 3 / 100;
        const adjustedAtrValue = atr14Day * adjustedAtrPercentage;

        const bullStopLossUnderlying = underlyingEntryPrice - adjustedAtrValue;
        const bullStopLossMiniFuture =
          miniFuturePrice *
          (1 - (adjustedAtrValue / underlyingEntryPrice) * leverage);
        const bearStopLossUnderlying = underlyingEntryPrice + adjustedAtrValue;

        const miniFutureStopLossPercentage = (
          ((bullStopLossMiniFuture - miniFuturePrice) / miniFuturePrice) *
          100
        ).toFixed(2);
        const underlyingStopLossPercentage = (
          ((bullStopLossUnderlying - underlyingEntryPrice) /
            underlyingEntryPrice) *
          100
        ).toFixed(2);

        document.getElementById("adjustedAtrPercentage").textContent =
          (adjustedAtrPercentage * 100).toFixed(2) + "%";
        document.getElementById("adjustedAtrValue").textContent =
          adjustedAtrValue.toFixed(2);
        document.getElementById("bullStopLossUnderlying").textContent =
          bullStopLossUnderlying.toFixed(2);
        document.getElementById("stopLossMiniFuture").textContent =
          bullStopLossMiniFuture.toFixed(2) + " SEK";
        document.getElementById("bearStopLossUnderlying").textContent =
          bearStopLossUnderlying.toFixed(2);
        document.getElementById(
          "stopLossMiniFuturePercentage"
        ).textContent = `(${miniFutureStopLossPercentage}%)`;
        document.getElementById(
          "stopLossUnderlyingPercentage"
        ).textContent = `(${underlyingStopLossPercentage}%)`;
      }
    </script>
  </body>
</html>
